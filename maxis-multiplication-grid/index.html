<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maxi's Multiplication Grid</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }

  h1 {
    font-family: 'Fredoka One', cursive;
    color: #fff;
    font-size: 2.2rem;
    text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .stats-bar {
    display: flex;
    gap: 20px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .stat {
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 6px 18px;
    color: #fff;
    font-weight: 700;
    font-size: 0.95rem;
  }

  .progress-bar-container {
    width: 90%;
    max-width: 780px;
    height: 18px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #f093fb, #f5576c, #ffd200);
    border-radius: 10px;
    transition: width 0.5s ease;
    width: 0%;
  }

  .grid-wrapper {
    position: relative;
    background: rgba(255,255,255,0.95);
    border-radius: 16px;
    padding: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
  }

  table {
    border-collapse: collapse;
  }

  td, th {
    width: 52px;
    height: 42px;
    text-align: center;
    font-size: 0.85rem;
    font-weight: 700;
    border: 1px solid #e0e0e0;
    position: relative;
    transition: all 0.15s ease;
  }

  th {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-size: 0.95rem;
    border-color: rgba(255,255,255,0.3);
  }

  th.corner {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    font-size: 1.1rem;
  }

  td.solved {
    background: linear-gradient(135deg, #a8edea, #fed6e3);
    color: #2d3748;
    cursor: default;
    font-weight: 800;
  }

  td.unsolved {
    background: #fff;
    cursor: pointer;
    color: #cbd5e0;
  }

  td.unsolved:hover {
    background: #f0e6ff;
    transform: scale(1.05);
    z-index: 2;
    box-shadow: 0 4px 15px rgba(102,126,234,0.4);
  }

  td.highlight {
    background: linear-gradient(135deg, #ffd200, #ff6b6b) !important;
    color: #fff !important;
    transform: scale(1.1);
    z-index: 3;
    box-shadow: 0 4px 20px rgba(255,107,107,0.6);
  }

  td.selected {
    background: linear-gradient(135deg, #ff6b6b, #ee5a24) !important;
    color: #fff !important;
    transform: scale(1.15);
    z-index: 4;
    box-shadow: 0 6px 25px rgba(238,90,36,0.7);
    animation: pulse-selected 0.6s ease infinite;
  }

  @keyframes pulse-selected {
    0%, 100% { transform: scale(1.15); }
    50% { transform: scale(1.2); }
  }

  .overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(5px);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }

  .overlay.active { display: flex; }

  .modal {
    background: #fff;
    border-radius: 24px;
    padding: 30px 40px;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    animation: modal-pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    max-width: 400px;
    width: 90%;
    position: relative;
    overflow: visible;
  }

  @keyframes modal-pop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .modal h2 {
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
    color: #4a5568;
    margin-bottom: 5px;
  }

  .modal .equation {
    font-family: 'Fredoka One', cursive;
    font-size: 2.5rem;
    color: #667eea;
    margin: 10px 0;
  }

  .modal input {
    font-family: 'Nunito', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    text-align: center;
    width: 140px;
    padding: 8px;
    border: 3px solid #e2e8f0;
    border-radius: 12px;
    outline: none;
    transition: border-color 0.2s;
  }

  .modal input:focus {
    border-color: #667eea;
  }

  .modal input.shake {
    animation: shake 0.5s ease;
    border-color: #f56565;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  .modal button {
    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    padding: 10px 30px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 12px;
    transition: all 0.2s;
    color: #fff;
  }

  .btn-check {
    background: linear-gradient(135deg, #667eea, #764ba2);
  }

  .btn-check:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(102,126,234,0.5); }

  .btn-skip {
    background: rgba(0,0,0,0.1);
    color: #718096 !important;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 6px 16px;
    margin-left: 10px;
  }

  .btn-skip:hover { background: rgba(0,0,0,0.15); }

  .wrong-msg {
    color: #f56565;
    font-weight: 800;
    font-size: 0.95rem;
    margin-top: 8px;
    min-height: 24px;
  }

  .btn-spin {
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    padding: 14px 40px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    background: linear-gradient(135deg, #f093fb, #f5576c);
    color: #fff;
    box-shadow: 0 6px 20px rgba(240,147,251,0.5);
    transition: all 0.2s;
    margin-bottom: 10px;
  }

  .btn-spin:hover { transform: scale(1.05); box-shadow: 0 8px 30px rgba(240,147,251,0.7); }
  .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-reset {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    padding: 6px 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.8);
    transition: all 0.2s;
  }

  .btn-reset:hover { background: rgba(255,255,255,0.4); color: #fff; }

  .celebration-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 200;
  }

  .animal-container {
    position: relative;
    width: 120px;
    height: 120px;
    margin: 10px auto;
  }

  .animal-svg {
    width: 100%;
    height: 100%;
    animation: animal-bounce 1s ease infinite;
  }

  @keyframes animal-bounce {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
  }

  .success-text {
    font-family: 'Fredoka One', cursive;
    font-size: 1.8rem;
    background: linear-gradient(135deg, #f093fb, #f5576c, #ffd200);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .completion-banner {
    display: none;
    background: linear-gradient(135deg, #ffd200, #f5576c, #f093fb);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 14px;
    text-align: center;
    animation: rainbow-shift 3s ease infinite;
  }

  .completion-banner.active { display: block; }

  @keyframes rainbow-shift {
    0%, 100% { filter: hue-rotate(0deg); }
    50% { filter: hue-rotate(30deg); }
  }

  .completion-banner h2 {
    font-family: 'Fredoka One', cursive;
    color: #fff;
    font-size: 1.8rem;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
  }

  @media (max-width: 700px) {
    td, th { width: 38px; height: 32px; font-size: 0.7rem; }
    th { font-size: 0.75rem; }
    h1 { font-size: 1.5rem; }
    .modal .equation { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<h1>Maxi's Multiplication Grid</h1>

<div class="stats-bar">
  <div class="stat" id="stat-solved">Solved: 0 / 144</div>
  <div class="stat" id="stat-streak">Streak: 0</div>

<div class="progress-bar-container">

</div>

<div class="completion-banner" id="completion-banner">

</div>

<button class="btn-spin" id="btn-spin" onclick="startSpin()">Spin & Solve!</button>

<div class="grid-wrapper">

</div>

<br>
<button class="btn-reset" onclick="resetProgress()">Reset Progress</button>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">

      <input type="number" id="answer-input" autocomplete="off" inputmode="numeric">
      <br>
      <button class="btn-check" onclick="checkAnswer()">Check!</button>
      <button class="btn-skip" onclick="skipQuestion()">Skip</button>
      <div class="wrong-msg" id="wrong-msg"></div>
    </div>
    <div id="modal-success" style="display:none;">
      <div class="success-text" id="success-text">Amazing!</div>
      <div class="animal-container" id="animal-container"></div>
      <p style="color:#718096;font-weight:700;" id="answer-reveal"></p>
    </div>
  </div>
</div>

<canvas class="celebration-canvas" id="confetti-canvas"></canvas>

const PRAISES = [
  "Amazing!", "You're a star!", "Brilliant!", "Math wizard!",
  "Fantastic!", "Super smart!", "Incredible!", "Nailed it!",
  "Genius!", "Awesome!", "Perfect!", "Wow, so quick!"
];

let solved = {};
let currentCell = null;
let spinning = false;
let streak = 0;

function loadProgress() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (data && data.solved) {
      solved = data.solved;
      streak = data.streak || 0;
    }
  } catch(e) {}
}

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ solved, streak }));
}

function buildGrid() {
  const table = document.getElementById('grid');
  table.innerHTML = '';

  const headerRow = document.createElement('tr');
  const corner = document.createElement('th');
  corner.className = 'corner';
  corner.textContent = '×';
  headerRow.appendChild(corner);
  for (let c = 1; c <= GRID_SIZE; c++) {
    const th = document.createElement('th');
    th.textContent = c;
    headerRow.appendChild(th);
  }
  table.appendChild(headerRow);

  for (let r = 1; r <= GRID_SIZE; r++) {
    const row = document.createElement('tr');
    const rh = document.createElement('th');
    rh.textContent = r;
    row.appendChild(rh);
    for (let c = 1; c <= GRID_SIZE; c++) {
      const td = document.createElement('td');
      td.id = `cell-${r}-${c}`;
      td.dataset.row = r;
      td.dataset.col = c;
      const key = `${r}x${c}`;
      if (solved[key]) {
        td.className = 'solved';
        td.textContent = r * c;
      } else {
        td.className = 'unsolved';
        td.textContent = '?';
        td.onclick = () => openQuestion(r, c);
      }
      row.appendChild(td);
    }
    table.appendChild(row);
  }
  updateStats();
}

function getUnsolvedCells() {
  const cells = [];
  for (let r = 1; r <= GRID_SIZE; r++) {
    for (let c = 1; c <= GRID_SIZE; c++) {
      if (!solved[`${r}x${c}`]) cells.push({ r, c });
    }
  }
  return cells;
}

function updateStats() {
  const count = Object.keys(solved).length;
  document.getElementById('stat-solved').textContent = `Solved: ${count} / 144`;
  document.getElementById('stat-streak').textContent = `Streak: ${streak}`;
  document.getElementById('progress-fill').style.width = `${(count / 144) * 100}%`;

  const banner = document.getElementById('completion-banner');
  if (count >= 144) {
    banner.classList.add('active');
    document.getElementById('btn-spin').disabled = true;
  } else {
    banner.classList.remove('active');
    document.getElementById('btn-spin').disabled = false;
  }
}

function startSpin() {
  if (spinning) return;
  const unsolved = getUnsolvedCells();
  if (unsolved.length === 0) return;

  spinning = true;
  document.getElementById('btn-spin').disabled = true;

  document.querySelectorAll('td.highlight').forEach(el => el.classList.remove('highlight'));

  const totalSteps = 25 + Math.floor(Math.random() * 15);
  const targetIdx = Math.floor(Math.random() * unsolved.length);
  let step = 0;
  let idx = Math.floor(Math.random() * unsolved.length);
  let prevCell = null;

  function tick() {
    if (prevCell) prevCell.classList.remove('highlight');

    const cell = unsolved[idx % unsolved.length];
    const el = document.getElementById(`cell-${cell.r}-${cell.c}`);
    el.classList.add('highlight');
    prevCell = el;

    step++;
    idx++;

    if (step >= totalSteps - 5) {
      idx = (targetIdx - (totalSteps - step) + unsolved.length * 100) % unsolved.length;
    }

    if (step < totalSteps) {
      const progress = step / totalSteps;
      const eased = progress * progress * progress;
      const delay = 50 + eased * 450;
      setTimeout(tick, delay);
    } else {
      const finalCell = unsolved[targetIdx];
      if (prevCell) prevCell.classList.remove('highlight');
      const finalEl = document.getElementById(`cell-${finalCell.r}-${finalCell.c}`);
      finalEl.classList.add('selected');

      setTimeout(() => {
        finalEl.classList.remove('selected');
        spinning = false;
        document.getElementById('btn-spin').disabled = false;
        openQuestion(finalCell.r, finalCell.c);
      }, 800);
    }
  }

  tick();
}

function openQuestion(row, col) {
  if (solved[`${row}x${col}`]) return;
  currentCell = { row, col };

  document.getElementById('modal-question').style.display = 'block';
  document.getElementById('modal-success').style.display = 'none';
  document.getElementById('equation').textContent = `${row} × ${col} = ?`;
  document.getElementById('wrong-msg').textContent = '';
  document.getElementById('answer-input').value = '';
  document.getElementById('overlay').classList.add('active');

  setTimeout(() => document.getElementById('answer-input').focus(), 100);
}

function checkAnswer() {
  if (!currentCell) return;
  const input = document.getElementById('answer-input');
  const answer = parseInt(input.value);
  const correct = currentCell.row * currentCell.col;

  if (answer === correct) {
    solved[`${currentCell.row}x${currentCell.col}`] = true;
    streak++;
    saveProgress();

    const cell = document.getElementById(`cell-${currentCell.row}-${currentCell.col}`);
    cell.className = 'solved';
    cell.textContent = correct;
    cell.onclick = null;

    showSuccess(currentCell.row, currentCell.col, correct);
    updateStats();
  } else {
    streak = 0;
    saveProgress();
    updateStats();
    input.classList.add('shake');
    document.getElementById('wrong-msg').textContent = 'Not quite! Try again!';
    setTimeout(() => {
      input.classList.remove('shake');
      input.value = '';
      input.focus();
    }, 500);
  }
}

function skipQuestion() {
  document.getElementById('overlay').classList.remove('active');
  currentCell = null;
}

function showSuccess(row, col, answer) {
  document.getElementById('modal-question').style.display = 'none';
  document.getElementById('modal-success').style.display = 'block';

  const praise = PRAISES[Math.floor(Math.random() * PRAISES.length)];
  document.getElementById('success-text').textContent = praise;
  document.getElementById('answer-reveal').textContent = `${row} × ${col} = ${answer}`;

  const animal = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
  document.getElementById('animal-container').innerHTML = `<div class="animal-svg">${animal.svg}</div>`;

  launchConfetti();

  setTimeout(() => {
    document.getElementById('overlay').classList.remove('active');
    currentCell = null;

    if (Object.keys(solved).length >= 144) {
      launchConfetti();
      setTimeout(launchConfetti, 500);
      setTimeout(launchConfetti, 1000);
    }
  }, 2200);
}

function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const particles = [];
  const colors = ['#f093fb', '#f5576c', '#ffd200', '#667eea', '#48bb78', '#ff6b6b', '#4ecdc4', '#a78bfa'];
  const shapes = ['circle', 'rect', 'star'];

  for (let i = 0; i < 120; i++) {
    const x = canvas.width / 2 + (Math.random() - 0.5) * 200;
    particles.push({
      x, y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 16,
      vy: -Math.random() * 18 - 4,
      size: Math.random() * 8 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      shape: shapes[Math.floor(Math.random() * shapes.length)],
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.3,
      gravity: 0.25 + Math.random() * 0.15,
      life: 1
    });
  }

  function drawStar(cx, cy, size, rotation) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
      const method = i === 0 ? 'moveTo' : 'lineTo';
      ctx[method](Math.cos(angle) * size, Math.sin(angle) * size);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  let frame;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;

    particles.forEach(p => {
      if (p.life <= 0) return;
      alive = true;
      p.x += p.vx;
      p.vy += p.gravity;
      p.y += p.vy;
      p.vx *= 0.99;
      p.rotation += p.rotSpeed;
      p.life -= 0.012;

      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;

      if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.shape === 'rect') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.fillRect(-p.size, -p.size / 2, p.size * 2, p.size);
        ctx.restore();
      } else {
        drawStar(p.x, p.y, p.size, p.rotation);
      }
    });

    ctx.globalAlpha = 1;
    if (alive) {
      frame = requestAnimationFrame(animate);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  if (frame) cancelAnimationFrame(frame);
  animate();
}

function resetProgress() {
  if (confirm('Reset all progress? This cannot be undone!')) {
    solved = {};
    streak = 0;
    saveProgress();
    buildGrid();
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.getElementById('overlay').classList.contains('active')) {
    const questionVisible = document.getElementById('modal-question').style.display !== 'none';
    if (questionVisible) checkAnswer();
  }
  if (e.key === 'Escape') skipQuestion();
});

loadProgress();
buildGrid();
</script>
