<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>MSM — Locale Matrix</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header class="app-header">
            <div class="brand">
                <h1>MSM</h1>
                <p>Locale coverage matrix from sitemap URLs</p>
            </div>
            <form id="input-form" class="url-form">
                <input id="url" type="url" placeholder="https://example.com/sitemap.xml" required>
                <button type="submit">Fetch</button>
            </form>
        </header>

        <div id="load-status" class="load-status" hidden>
            <span class="load-status-label">Loading</span>
            <span id="load-status-file"></span>
            ·
            <span id="load-status-count">0</span> URLs
        </div>

        <main class="app-main">
            <section class="explorer-panel">
                <div class="explorer-header">
                    <span id="total-paths" class="count-pill">0</span> paths
                    <span id="locale-meta" class="meta-note"></span>
                </div>
                <div class="msm-scroll">
                    <div id="msm-grid" class="msm-grid">
                        <div id="msm-header" class="msm-header-row" hidden></div>
                        <div id="tree-root" class="tree-root">
                            <div class="tree-empty">Enter a sitemap URL above to get started</div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <script src="msm.js"></script>
    </body>
</html>
